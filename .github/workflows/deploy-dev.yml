# Deploy alliance-devops-dashboard to AWS (dev).
#
# Triggers: push to dev (automatic deploy) and workflow_dispatch (manual).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOYMENT_AWS_ACCESS_KEY_ID     — github-actions-deploy user (CloudFormation/Lambda/DynamoDB/IAM/S3/SecretsManager)
#   DEPLOYMENT_AWS_SECRET_ACCESS_KEY
#
# Optional (OIDC — preferred long term; replace the access-key step when configured):
#   AWS_DEPLOY_ROLE_ARN        — IAM role ARN for GitHub OIDC
#
# GitHub environment (Settings → Environments → dev):
#   Optional protection rules / required reviewers for production-like gates.

name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  STACK_NAME: devops-dashboard-dev
  SAM_TEMPLATE: infrastructure/sam/template.yaml
  SAM_CONFIG: infrastructure/environments/dev.toml
  SECRET_NAME: dev/app/backend/devops-dashboard/updown-ingestion
  POWERBI_SECRET_NAME: dev/app/backend/devops-dashboard/powerbi-export
  LOG_LEVEL: debug

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build Lambda artifacts
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist/lambdas/updown-alert-ingestion
          test -d dist/lambdas/powerbi-data-export
          test -f dist/package.json

  sam-validate:
    name: SAM Template Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file infrastructure/sam/template.yaml --lint

  deploy:
    name: Deploy to AWS Dev
    runs-on: ubuntu-latest
    needs: [quality, sam-validate]
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build Lambda artifacts
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOYMENT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOYMENT_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Resolve Updown webhook secret
        id: secret
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "${{ env.SECRET_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query SecretString \
            --output text > secret_raw.txt

          UPDOWN_WEBHOOK_SECRET=$(python3 - <<'PY'
          import json
          import sys

          raw = open("secret_raw.txt", encoding="utf-8").read().strip()
          data = json.loads(raw)
          secret = data.get("UPDOWN_WEBHOOK_SECRET")
          if not secret:
              sys.stderr.write("UPDOWN_WEBHOOK_SECRET not found in secret JSON\n")
              sys.exit(1)
          print(secret)
          PY
          )
          rm -f secret_raw.txt
          echo "::add-mask::${UPDOWN_WEBHOOK_SECRET}"
          echo "value=${UPDOWN_WEBHOOK_SECRET}" >> "$GITHUB_OUTPUT"

      - name: Resolve Power BI API key
        id: powerbi_secret
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "${{ env.POWERBI_SECRET_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query SecretString \
            --output text > powerbi_secret_raw.txt

          POWERBI_API_KEY=$(python3 - <<'PY'
          import json
          import sys

          raw = open("powerbi_secret_raw.txt", encoding="utf-8").read().strip()
          data = json.loads(raw)
          secret = data.get("POWERBI_API_KEY")
          if not secret:
              sys.stderr.write("POWERBI_API_KEY not found in secret JSON\n")
              sys.exit(1)
          print(secret)
          PY
          )
          rm -f powerbi_secret_raw.txt
          echo "::add-mask::${POWERBI_API_KEY}"
          echo "value=${POWERBI_API_KEY}" >> "$GITHUB_OUTPUT"

      - name: SAM build
        run: sam build --template-file infrastructure/sam/template.yaml

      - name: SAM deploy
        run: |
          set -euo pipefail
          # --config-file is resolved relative to the template directory (.aws-sam/build/), not repo root.
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --config-file "${{ github.workspace }}/infrastructure/environments/dev.toml" \
            --config-env dev \
            --stack-name "${{ env.STACK_NAME }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=${{ env.ENVIRONMENT }}" \
              "LogLevel=${{ env.LOG_LEVEL }}" \
              "UpdownWebhookSecret=${{ steps.secret.outputs.value }}" \
              "PowerBiApiKey=${{ steps.powerbi_secret.outputs.value }}" \
              "UpdownChecksTableNameOverride=alliance-devops-updown-checks-dev" \
              "UptimeEventsTableNameOverride=alliance-devops-uptime-events-dev" \
              "DeploymentsTableName=jenkinsexecutions_test" \
              "DeploymentMetadataTableName=deployment_metadata" \
            --capabilities CAPABILITY_IAM \
            --region "${{ env.AWS_REGION }}" \
            --resolve-s3

      - name: Verify deployment outputs
        run: |
          set -euo pipefail
          WEBHOOK_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UpdownAlertWebhookUrl'].OutputValue" \
            --output text)

          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" = "None" ]; then
            echo "UpdownAlertWebhookUrl output not found"
            exit 1
          fi

          echo "Deployment successful."
          echo "UpdownAlertWebhookUrl=$WEBHOOK_URL"

      - name: Job summary
        if: success()
        run: |
          WEBHOOK_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UpdownAlertWebhookUrl'].OutputValue" \
            --output text)
          POWERBI_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='PowerBiExportBaseUrl'].OutputValue" \
            --output text)
          {
            echo "## Deploy Dev — success"
            echo ""
            echo "| Output | Value |"
            echo "|--------|-------|"
            echo "| Stack | \`${{ env.STACK_NAME }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo "| Updown webhook base URL | \`$WEBHOOK_URL\` |"
            echo "| Power BI export base URL | \`$POWERBI_URL\` |"
            echo ""
            echo "Configure Updown.io with \`$WEBHOOK_URL?webhook-secret=<secret>\`"
            echo ""
            echo "Power BI endpoints require header \`x-api-key\` (see Secrets Manager \`${{ env.POWERBI_SECRET_NAME }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
