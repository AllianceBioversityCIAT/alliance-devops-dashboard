AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Alliance DevOps Dashboard — Serverless infrastructure skeleton

# =============================================================================
# PARAMETERS
# =============================================================================

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
    Description: Deployment environment

  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error

  UpdownWebhookSecret:
    Type: String
    NoEcho: true
    Description: Shared secret for Updown webhook authentication (x-webhook-secret)

  UptimeEventsTableNameOverride:
    Type: String
    Default: ''
    Description: Optional override for existing uptime events table name

  UpdownChecksTableNameOverride:
    Type: String
    Default: ''
    Description: Optional override for existing updown checks table name

  PowerBiApiKey:
    Type: String
    NoEcho: true
    Description: API key value for Power BI export routes (x-api-key header)

  DeploymentsTableName:
    Type: String
    Default: jenkinsexecutions_test
    Description: Legacy Jenkins executions table for Power BI deployments export

  DeploymentMetadataTableName:
    Type: String
    Default: deployment_metadata
    Description: Jenkins job metadata table joined by job_name for deployment exports

Conditions:
  HasCustomUptimeTableName: !Not [!Equals [!Ref UptimeEventsTableNameOverride, '']]
  CreateUptimeEventsTable: !Not [!Condition HasCustomUptimeTableName]
  HasCustomUpdownChecksTableName: !Not [!Equals [!Ref UpdownChecksTableNameOverride, '']]
  CreateUpdownChecksTable: !Not [!Condition HasCustomUpdownChecksTableName]

# =============================================================================
# GLOBALS
# =============================================================================

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        SERVICE_NAME: alliance-devops-dashboard
        EVENTS_TABLE_NAME: !Ref EventsTable
        RELEASES_TABLE_NAME: !Ref ReleasesTable
        IMPROVEMENTS_TABLE_NAME: !Ref ImprovementsTable
        PLATFORMS_TABLE_NAME: !Ref PlatformsTable
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    Tracing: Active
    Tags:
      Project: ALL
      Functionality: devops-dashboard
      Environment: !Ref Environment
  Api:
    PropagateTags: true

# =============================================================================
# RESOURCES
# =============================================================================

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  ReleasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-releases'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  ImprovementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-improvements'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  PlatformsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-platforms'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  UptimeEventsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateUptimeEventsTable
    Properties:
      TableName: !Sub 'alliance-devops-uptime-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  UpdownChecksTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateUpdownChecksTable
    Properties:
      TableName: !Sub 'alliance-devops-updown-checks-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ALL
        - Key: Functionality
          Value: devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda Functions
  # ---------------------------------------------------------------------------

  JenkinsIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'devops-dashboard-${Environment}-jenkins-ingestion'
      Description: Ingests deployment events from Jenkins
      CodeUri: ../../dist/
      Handler: lambdas/jenkins-ingestion/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        JenkinsWebhook:
          Type: Api
          Properties:
            Path: /ingest/jenkins
            Method: POST

  UpdownAlertIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alliance-devops-updown-alert-ingestion-${Environment}'
      Description: Ingests Updown webhook alert events
      CodeUri: ../../dist/
      Handler: lambdas/updown-alert-ingestion/index.handler
      Environment:
        Variables:
          APP_NAME: alliance-devops-dashboard
          LAMBDA_NAME: updown-alert-ingestion
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          UPTIME_EVENTS_TABLE: !If
            - HasCustomUptimeTableName
            - !Ref UptimeEventsTableNameOverride
            - !Ref UptimeEventsTable
          UPDOWN_CHECKS_TABLE: !If
            - HasCustomUpdownChecksTableName
            - !Ref UpdownChecksTableNameOverride
            - !Ref UpdownChecksTable
          UPDOWN_WEBHOOK_SECRET: !Ref UpdownWebhookSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !If
              - HasCustomUptimeTableName
              - !Ref UptimeEventsTableNameOverride
              - !Ref UptimeEventsTable
        - DynamoDBCrudPolicy:
            TableName: !If
              - HasCustomUpdownChecksTableName
              - !Ref UpdownChecksTableNameOverride
              - !Ref UpdownChecksTable
      Events:
        UpdownAlertWebhook:
          Type: Api
          Properties:
            Path: /api/webhooks/updown/alerts
            Method: POST

  ReleaseNotesIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'devops-dashboard-${Environment}-release-notes-ingestion'
      Description: Ingests release notes and technical improvements
      CodeUri: ../../dist/
      Handler: lambdas/release-notes-ingestion/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReleasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ImprovementsTable
      Events:
        ReleaseNotesWebhook:
          Type: Api
          Properties:
            Path: /ingest/release-notes
            Method: POST

  PowerBiDataExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alliance-devops-powerbi-data-export-${Environment}'
      Description: Exports DynamoDB data for Power BI and Lakehouse consumption
      CodeUri: ../../dist/
      Handler: lambdas/powerbi-data-export/index.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          APP_NAME: alliance-devops-dashboard
          LAMBDA_NAME: powerbi-data-export
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          CHECKS_TABLE_NAME: !If
            - HasCustomUpdownChecksTableName
            - !Ref UpdownChecksTableNameOverride
            - !Ref UpdownChecksTable
          EVENTS_TABLE_NAME: !If
            - HasCustomUptimeTableName
            - !Ref UptimeEventsTableNameOverride
            - !Ref UptimeEventsTable
          DEPLOYMENTS_TABLE_NAME: !Ref DeploymentsTableName
          DEPLOYMENT_METADATA_TABLE_NAME: !Ref DeploymentMetadataTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !If
              - HasCustomUpdownChecksTableName
              - !Ref UpdownChecksTableNameOverride
              - !Ref UpdownChecksTable
        - DynamoDBReadPolicy:
            TableName: !If
              - HasCustomUptimeTableName
              - !Ref UptimeEventsTableNameOverride
              - !Ref UptimeEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentMetadataTableName
      Events:
        PowerBiChecksFull:
          Type: Api
          Properties:
            Path: /powerbi/checks/full
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiChecks:
          Type: Api
          Properties:
            Path: /powerbi/checks
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiChecksByMonth:
          Type: Api
          Properties:
            Path: /powerbi/checks/by-month
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiChecksCurrentMonth:
          Type: Api
          Properties:
            Path: /powerbi/checks/current-month
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiEventsFull:
          Type: Api
          Properties:
            Path: /powerbi/events/full
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiEvents:
          Type: Api
          Properties:
            Path: /powerbi/events
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiEventsByMonth:
          Type: Api
          Properties:
            Path: /powerbi/events/by-month
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiEventsCurrentMonth:
          Type: Api
          Properties:
            Path: /powerbi/events/current-month
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiDeploymentsFull:
          Type: Api
          Properties:
            Path: /powerbi/deployments/full
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiDeployments:
          Type: Api
          Properties:
            Path: /powerbi/deployments
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiDeploymentsByMonth:
          Type: Api
          Properties:
            Path: /powerbi/deployments/by-month
            Method: get
            Auth:
              ApiKeyRequired: true
        PowerBiDeploymentsCurrentMonth:
          Type: Api
          Properties:
            Path: /powerbi/deployments/current-month
            Method: get
            Auth:
              ApiKeyRequired: true

  PowerBiApiKeyResource:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub 'powerbi-export-${Environment}'
      Enabled: true
      Value: !Ref PowerBiApiKey

  PowerBiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ServerlessRestApiProdStage
    Properties:
      UsagePlanName: !Sub 'powerbi-export-${Environment}'
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: Prod

  PowerBiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref PowerBiApiKeyResource
      KeyType: API_KEY
      UsagePlanId: !Ref PowerBiUsagePlan

# =============================================================================
# OUTPUTS
# =============================================================================

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  EventsTableName:
    Description: DynamoDB events table name
    Value: !Ref EventsTable

  ReleasesTableName:
    Description: DynamoDB releases table name
    Value: !Ref ReleasesTable

  ImprovementsTableName:
    Description: DynamoDB improvements table name
    Value: !Ref ImprovementsTable

  PlatformsTableName:
    Description: DynamoDB platforms table name
    Value: !Ref PlatformsTable

  UptimeEventsTableName:
    Description: DynamoDB uptime events table name
    Value: !If
      - HasCustomUptimeTableName
      - !Ref UptimeEventsTableNameOverride
      - !Ref UptimeEventsTable

  UpdownChecksTableName:
    Description: DynamoDB updown checks registry table name
    Value: !If
      - HasCustomUpdownChecksTableName
      - !Ref UpdownChecksTableNameOverride
      - !Ref UpdownChecksTable

  UpdownAlertWebhookUrl:
    Description: Updown alert webhook URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/webhooks/updown/alerts'

  PowerBiExportBaseUrl:
    Description: Power BI export API base URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/powerbi'
