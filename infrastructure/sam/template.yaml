AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Alliance DevOps Dashboard — Serverless infrastructure skeleton

# =============================================================================
# PARAMETERS
# =============================================================================

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
    Description: Deployment environment

  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error

# =============================================================================
# GLOBALS
# =============================================================================

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        SERVICE_NAME: alliance-devops-dashboard
        EVENTS_TABLE_NAME: !Ref EventsTable
        RELEASES_TABLE_NAME: !Ref ReleasesTable
        IMPROVEMENTS_TABLE_NAME: !Ref ImprovementsTable
        PLATFORMS_TABLE_NAME: !Ref PlatformsTable
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    Tracing: Active

# =============================================================================
# RESOURCES
# =============================================================================

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: alliance-devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  ReleasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-releases'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: alliance-devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  ImprovementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-improvements'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: alliance-devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  PlatformsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'devops-dashboard-${Environment}-platforms'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: alliance-devops-dashboard
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda Functions (placeholders — wire CodeUri after build pipeline)
  # ---------------------------------------------------------------------------

  JenkinsIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'devops-dashboard-${Environment}-jenkins-ingestion'
      Description: Ingests deployment events from Jenkins
      CodeUri: ../../dist/lambdas/jenkins-ingestion/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        JenkinsWebhook:
          Type: Api
          Properties:
            Path: /ingest/jenkins
            Method: POST

  UpdownIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'devops-dashboard-${Environment}-updown-ingestion'
      Description: Ingests uptime events from Updown.io
      CodeUri: ../../dist/lambdas/updown-ingestion/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        UpdownWebhook:
          Type: Api
          Properties:
            Path: /ingest/updown
            Method: POST
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Poll Updown API for check status
            Enabled: false

  ReleaseNotesIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'devops-dashboard-${Environment}-release-notes-ingestion'
      Description: Ingests release notes and technical improvements
      CodeUri: ../../dist/lambdas/release-notes-ingestion/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReleasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ImprovementsTable
      Events:
        ReleaseNotesWebhook:
          Type: Api
          Properties:
            Path: /ingest/release-notes
            Method: POST

# =============================================================================
# OUTPUTS
# =============================================================================

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  EventsTableName:
    Description: DynamoDB events table name
    Value: !Ref EventsTable

  ReleasesTableName:
    Description: DynamoDB releases table name
    Value: !Ref ReleasesTable

  ImprovementsTableName:
    Description: DynamoDB improvements table name
    Value: !Ref ImprovementsTable

  PlatformsTableName:
    Description: DynamoDB platforms table name
    Value: !Ref PlatformsTable
